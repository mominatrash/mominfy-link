<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mominfy</title>
<meta name="description" content="Listen to this song in Mominfy · اسمع هذه الأغنية في Mominfy">
<!-- What chat apps show for the link: the app's name and icon on a tidy card. -->
<meta property="og:type" content="music.song">
<meta property="og:site_name" content="Mominfy">
<meta property="og:title" content="Listen on Mominfy · اسمعها على Mominfy">
<meta property="og:description" content="Tap to open the song in Mominfy">
<meta property="og:image" content="https://mominatrash.github.io/mominfy-link/icon.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#131110">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #131110; --card: #1e1b18; --line: #36312c; --text: #f4efe9; --muted: #a9a39a; --accent: #e8c9a0; --on-accent: #2a1d0c; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; font-weight: 600; }
  .brand img { width: 28px; height: 28px; border-radius: 8px; }
  .cover {
    display: block; width: 100%; aspect-ratio: 1; margin: 22px 0 0; border-radius: 16px; object-fit: cover;
    background: var(--card); border: 1px solid var(--line);
  }
  .song { margin: 22px 0 6px; font-size: 24px; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
  .artist { color: var(--muted); font-size: 16px; overflow-wrap: anywhere; min-height: 1.2em; }
  .open {
    display: block; margin: 28px 0 14px; padding: 15px; border-radius: 999px;
    background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 800; text-decoration: none;
  }
  .youtube { display: inline-block; color: var(--text); font-size: 15px; font-weight: 600; }
  .note { margin-top: 32px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .second { display: block; margin-top: 2px; font-size: 0.8em; font-weight: 600; opacity: 0.75; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <span class="brand"><img src="icon.png" alt="">Mominfy</span>
  <img class="cover" id="cover" alt="" hidden>
  <div class="song" id="song" dir="auto">Mominfy</div>
  <div class="artist" id="artist" dir="auto"></div>
  <a class="open" id="open" href="#">Open in Mominfy<span class="second" dir="rtl" lang="ar">افتح في <bdi>Mominfy</bdi></span></a>
  <a class="youtube" id="youtube" href="#" hidden>Listen on YouTube<span class="second" dir="rtl" lang="ar">اسمعها على يوتيوب</span></a>
  <p class="note">Don't have Mominfy? Ask whoever sent you this link.<span class="second" dir="rtl" lang="ar">ما عندك <bdi>Mominfy</bdi>؟ اطلبه من الشخص اللي بعتلك الرابط.</span></p>
</main>
<script>
  // What the link is for comes in the address: v = YouTube video, and for a song with no video,
  // t = title and a = artist; l = a shared playlist; j = a Jam to listen along to. Links stay short
  // in chats, and the page looks up names and covers itself. The app is opened through its own
  // mominfy://song address with the same details.
  var params = new URLSearchParams(location.search);
  var video = params.get('v');
  var title = params.get('t');
  var artist = params.get('a');
  var playlist = params.get('l');
  var jam = params.get('j');
  var valid = video && /^[\w-]{11}$/.test(video);

  function show(name, by) {
    if (name) {
      document.getElementById('song').textContent = name;
      document.title = name + ' · Mominfy';
    }
    if (by) document.getElementById('artist').textContent = by;
  }
  show(title, artist);

  if (valid) {
    var cover = document.getElementById('cover');
    cover.src = 'https://i.ytimg.com/vi/' + video + '/hqdefault.jpg';
    cover.hidden = false;
    var youtube = document.getElementById('youtube');
    youtube.href = 'https://youtu.be/' + video;
    youtube.hidden = false;
    if (!title) {
      fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + video))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (info) {
          if (!info) return;
          show(info.title, (info.author_name || '').replace(/\s*-\s*Topic$/, '').replace(/VEVO$/, ''));
        })
        .catch(function () {});
    }
  }

  // A shared playlist is public in Mominfy's database; its name and first cover show here.
  if (playlist && /^[\w-]{6,40}$/.test(playlist)) {
    show('Shared playlist', 'قائمة مشتركة');
    fetch('https://firestore.googleapis.com/v1/projects/mominfy-e6fb0/databases/(default)/documents/shared/' + playlist)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (found) {
        if (!found || !found.fields) return;
        var songs = ((found.fields.songs || {}).arrayValue || {}).values || [];
        show((found.fields.name || {}).stringValue, songs.length + (songs.length === 1 ? ' song' : ' songs'));
        var first = songs[0] && songs[0].mapValue && songs[0].mapValue.fields;
        var id = first && first.id && first.id.stringValue;
        if (id) {
          var cover = document.getElementById('cover');
          cover.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
          cover.hidden = false;
        }
      })
      .catch(function () {});
  }
  if (jam && /^[A-Za-z0-9]{6}$/.test(jam)) show('Listen along · ' + jam.toUpperCase(), 'اسمع مع صديقك');

  var query = location.search.slice(1);
  // Android's Chrome opens apps through an intent address; without the app it stays here.
  var here = location.href.split('#')[0];
  var app = /android/i.test(navigator.userAgent)
    ? 'intent://song?' + query + '#Intent;scheme=mominfy;package=com.mominatrash.mominfy;S.browser_fallback_url=' + encodeURIComponent(here + '#noapp') + ';end'
    : 'mominfy://song?' + query;
  document.getElementById('open').href = app;
  if (query && location.hash !== '#noapp') setTimeout(function () { location.href = app; }, 250);
</script>
</body>
</html>
