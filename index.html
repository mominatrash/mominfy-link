<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mominfy</title>
<meta name="description" content="Open this song in Mominfy · افتح هذه الأغنية في Mominfy">
<meta property="og:title" content="Mominfy">
<meta property="og:description" content="Open this song in Mominfy · افتح هذه الأغنية في Mominfy">
<meta property="og:image" content="https://mominatrash.github.io/mominfy-link/icon.png">
<meta name="theme-color" content="#121212">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #121212; --card: #1f1f1f; --text: #ffffff; --muted: #b3b3b3; --accent: #1ed760; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  .song { margin: 28px 0 6px; font-size: 24px; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
  .artist { color: var(--muted); font-size: 16px; overflow-wrap: anywhere; }
  .open {
    display: block; margin: 32px 0 14px; padding: 15px; border-radius: 999px;
    background: var(--accent); color: #000; font-size: 17px; font-weight: 800; text-decoration: none;
  }
  .youtube { color: var(--text); font-size: 15px; font-weight: 600; }
  .note { margin-top: 36px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .second { display: block; margin-top: 2px; font-size: 0.8em; font-weight: 600; opacity: 0.75; }
  .youtube { display: inline-block; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Mominfy">
  <div class="song" id="song" dir="auto">Mominfy</div>
  <div class="artist" id="artist" dir="auto"></div>
  <a class="open" id="open" href="#">Open in Mominfy<span class="second" dir="rtl" lang="ar">افتح في <bdi>Mominfy</bdi></span></a>
  <a class="youtube" id="youtube" href="#" hidden>Listen on YouTube<span class="second" dir="rtl" lang="ar">اسمعها على يوتيوب</span></a>
  <p class="note">Don't have Mominfy? Ask whoever sent you this link.<span class="second" dir="rtl" lang="ar">ما عندك <bdi>Mominfy</bdi>؟ اطلبه من الشخص اللي بعتلك الرابط.</span></p>
</main>
<script>
  // The song comes in the address: v = YouTube video, t = title, a = artist. The app is opened
  // through its own mominfy://song address with the same details.
  var params = new URLSearchParams(location.search);
  var video = params.get('v');
  var title = params.get('t');
  var artist = params.get('a');
  if (title) {
    document.getElementById('song').textContent = title;
    document.title = title + ' · Mominfy';
  }
  if (artist) document.getElementById('artist').textContent = artist;

  var query = location.search.slice(1);
  var youtube = video && /^[\w-]{11}$/.test(video) ? 'https://youtu.be/' + video : null;
  if (youtube) {
    var link = document.getElementById('youtube');
    link.href = youtube;
    link.hidden = false;
  }
  // Android's Chrome opens apps through an intent address; without the app it stays here.
  var here = location.href.split('#')[0];
  var app = /android/i.test(navigator.userAgent)
    ? 'intent://song?' + query + '#Intent;scheme=mominfy;package=com.mominatrash.mominfy;S.browser_fallback_url=' + encodeURIComponent(here + '#noapp') + ';end'
    : 'mominfy://song?' + query;
  document.getElementById('open').href = app;
  if (query && location.hash !== '#noapp') setTimeout(function () { location.href = app; }, 250);
</script>
</body>
</html>
